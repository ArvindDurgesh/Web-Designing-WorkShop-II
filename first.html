<!DOCTYPE html>

<body class="bg-light">

  
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-5">
    <a class="navbar-brand" href="#">TechStore</a>

    <div class="ms-auto">

  <div class="container py-5">

          <img src="laptop.webp" class="card-img-top">

            </button>

        </div>
      </div>

      
      <div class="col-md-4">
        <div class="card shadow-sm">
          <img src="iphone.webp" class="card-img-top">

          <div class="card-body">

            <h5>₹30,000 <span class="badge bg-danger">Sale</span></h5>

            <button class="btn btn-primary mt-2">
              View Details
            </button>
          </div>
        </div>
      </div>

      
      <div class="col-md-4">
        <div class="card shadow-sm">
          <img src="headphone.webp" class="card-img-top">

          <div class="card-body">
            <h4>Headphones</h4>

            <h5>₹5,000 <span class="badge bg-success">New</span></h5>

              View Details
            </button>

        </div>
      </div>

    </div>
